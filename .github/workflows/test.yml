name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg gifsicle shellcheck

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg gifsicle shellcheck

      - name: Syntax check
        run: bash -n .claude/skills/gif-maker/scripts/make-gif.sh tests/smoke.sh

      - name: Shellcheck
        run: shellcheck -S warning .claude/skills/gif-maker/scripts/make-gif.sh tests/smoke.sh

      - name: Smoke tests
        run: bash tests/smoke.sh
